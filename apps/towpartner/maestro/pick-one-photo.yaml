# Shared sub-flow: grant media-library permission (first call only — a no-op
# tap if already granted) and pick the first photo in the library. Referenced
# by `driver-kyc-submit.yaml` once per document. OS-version-specific — see
# that file's header comment.
appId: in.webcros.towpartner
---
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- tapOn:
    point: "10%, 30%"
