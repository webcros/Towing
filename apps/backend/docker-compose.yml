name: towfleet

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: towfleet
      POSTGRES_PASSWORD: towfleet
      POSTGRES_DB: towfleet
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U towfleet -d towfleet']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Test variant: same images, other ports, tmpfs storage so each CI/local test
  # run starts clean and fast. Start with: docker compose --profile test up -d
  postgres-test:
    image: postgis/postgis:16-3.4
    profiles: ['test']
    environment:
      POSTGRES_USER: towfleet
      POSTGRES_PASSWORD: towfleet
      POSTGRES_DB: towfleet_test
      # Durability is worthless for a throwaway DB; this is a large speed win.
      POSTGRES_INITDB_ARGS: '--nosync'
    command: ['postgres', '-c', 'fsync=off', '-c', 'full_page_writes=off', '-c', 'synchronous_commit=off']
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U towfleet -d towfleet_test']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis-test:
    image: redis:7
    profiles: ['test']
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # Load profiles (docs/load-testing.md). k6 is a Go binary rather than an npm
  # package, so the container is what makes `pnpm install` enough to run one.
  #   docker compose --profile load run --rm k6 run /scripts/read-paths.js
  k6:
    image: grafana/k6:latest
    profiles: ['load']
    volumes:
      - ./load:/scripts
    # host.docker.internal, NOT network_mode: host — Docker Desktop for Windows
    # has no host networking, so a host-networked service would silently fail
    # to reach the API running on the developer's machine.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      BASE_URL: ${LOAD_BASE_URL:-http://host.docker.internal:4000}

volumes:
  postgres-data:
  redis-data:
